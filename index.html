      else say('Ahí no va. Piensa: ¿es causa o efecto? ¿de qué columna?','bad');
    }
  }
  function attach(t){
    let sx=null,sy=0,drag=false,gh=null;
    t.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;drag=false;try{t.setPointerCapture(e.pointerId)}catch(_){}});
    t.addEventListener('pointermove',e=>{if(sx==null)return;if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){drag=true;gh=t.cloneNode(true);gh.classList.add('ghost','sel');document.body.appendChild(gh)}
      if(drag){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';const z=zoneAt(e.clientX,e.clientY);$$('.zone',host).forEach(x=>x.classList.toggle('over',x===z))}});
    t.addEventListener('pointerup',e=>{if(sx==null)return;sx=null;
      if(drag){gh.remove();gh=null;$$('.zone',host).forEach(x=>x.classList.remove('over'));const z=zoneAt(e.clientX,e.clientY);if(z)place(+t.dataset.i,z)}
      else{$$('.tray .tile',host).forEach(x=>x.classList.remove('sel'));t.classList.add('sel');sel=+t.dataset.i;tone('tap');say('Ahora toca su lugar en el árbol 👆','')}});
    t.addEventListener('pointercancel',()=>{sx=null;if(gh){gh.remove();gh=null}});
  }
  function tray(){const tr=$('#tray',host);sel=null;const vis=queue.slice(0,3);
    tr.innerHTML=vis.length?vis.map((c,i)=>`<button class="tile" data-i="${i}">${c.t}</button>`).join(''):'<p class="center" style="margin:0">¡No quedan piezas! 🎉</p>';
    $$('.tile',tr).forEach(attach)}
  $$('.zone',host).forEach(z=>z.onclick=()=>{if(sel!=null)place(sel,z);else say('Primero toca una tarjeta de abajo 👇','')});
  tray();
  $('#nx',host).onclick=()=>{tone('tap');done()};
};

/* ---------- micrófono: detecta las ideas clave que dices ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let MIC=null;
function stopMic(){if(!MIC)return;MIC.stopped=true;try{MIC.rec.stop()}catch(e){}if(MIC.btn){MIC.btn.classList.remove('rec');MIC.btn.innerHTML='🎙️ Hablar'}MIC=null}
function micBox(el,keys,opt={}){
  el.innerHTML=`<div class="mic"><div class="chips">${keys.map((k,i)=>`<button data-i="${i}" type="button">${k.l}</button>`).join('')}</div>
   ${SR?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn small" id="mb" type="button">🎙️ Hablar</button><span class="muted" id="ms" style="font-size:.85rem">Toca y dilo en voz alta: las ideas se encienden cuando las dices.</span></div><div class="live" id="lv"></div>`
       :`<p class="muted" style="font-size:.88rem">Este navegador no reconoce la voz (usa Chrome o Edge). Dilo en voz alta y toca las ideas que sí dijiste.</p>`}</div>`;
  const hit=new Set();
  const mark=i=>{if(hit.has(i))return;hit.add(i);$(`.chips [data-i="${i}"]`,el).classList.add('hit');tone('place');if(opt.onHit)opt.onHit(hit.size)};
  $$('.chips button',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(hit.has(i)){hit.delete(i);b.classList.remove('hit')}else mark(i)});
  const check=txt=>{const n=norm(txt);keys.forEach((k,i)=>{if(!hit.has(i)&&k.m.some(m=>n.includes(m)))mark(i)})};
  if(SR){const mb=$('#mb',el),lv=$('#lv',el),ms=$('#ms',el);let finalTxt='';
    mb.onclick=()=>{
      if(MIC&&MIC.el===el){stopMic();return}
      stopMic();hush();
      const rec=new SR();rec.lang='es-CO';rec.continuous=true;rec.interimResults=true;
      MIC={rec,el,btn:mb,stopped:false};
      rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalTxt+=r[0].transcript+' ';else interim+=r[0].transcript}const all=finalTxt+interim;lv.textContent=all.slice(-400);check(all)};
      rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'||ev.error==='audio-capture'){ms.textContent='No hay permiso de micrófono. Puedes tocar las ideas que dijiste.';stopMic()}};
      rec.onend=()=>{if(MIC&&MIC.rec===rec&&!MIC.stopped){try{rec.start()}catch(e){}}};
      try{rec.start();mb.classList.add('rec');mb.innerHTML='<span class="dot"></span> Escuchando… (toca para parar)'}catch(e){ms.textContent='No se pudo abrir el micrófono. Toca las ideas que dijiste.';MIC=null}
    }}
  return{score:()=>hit.size/keys.length,hits:()=>hit.size,stop:()=>{if(MIC&&MIC.el===el)stopMic()}};
}

/* ---------- fuegos artificiales y aplausos ---------- */
function fireworks(sec=6){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.id='fw';document.body.appendChild(cv);const g=cv.getContext('2d'),d=Math.min(2,devicePixelRatio||1);
  const W=innerWidth,H=innerHeight;cv.width=W*d;cv.height=H*d;g.scale(d,d);
  const cols=['#FFC23D','#7ED39A','#5BB5F0','#FF8A65','#FF9DB5','#FFF7E8'];let parts=[],rockets=[],t0=performance.now(),last=t0,lt=0;
  const launch=()=>rockets.push({x:W*(.15+Math.random()*.7),y:H,vx:(Math.random()-.5)*60,vy:-(H*.95+Math.random()*220),c:pick(cols),ty:H*(.12+Math.random()*.35)});
  function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const el=(now-t0)/1000;
    g.clearRect(0,0,W,H);lt-=dt;if(el<sec&&lt<=0){launch();if(Math.random()<.45)launch();lt=.3+Math.random()*.3}
    for(const r of rockets){r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy+=520*dt;g.fillStyle=r.c;g.beginPath();g.arc(r.x,r.y,3,0,7);g.fill();
      if(r.y<=r.ty||r.vy>=0){r.dead=1;if(Math.random()<.5)tone('pop');for(let i=0;i<70;i++){const a=Math.random()*7,s=60+Math.random()*230;parts.push({x:r.x,y:r.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:Math.random()<.7?r.c:pick(cols),l:1+Math.random()*.6})}}}
    rockets=rockets.filter(r=>!r.dead);
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;p.vx*=.985;p.l-=dt*.7;g.globalAlpha=Math.max(0,Math.min(1,p.l));g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;
    parts=parts.filter(p=>p.l>0);
    if(el<sec+2.6)requestAnimationFrame(loop);else cv.remove()}
  requestAnimationFrame(loop);
}
function applause(sec=4){
  if(!S.fx)return;const a=ac();if(!a)return;
  const len=Math.floor(a.sampleRate*sec),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0),n=Math.floor(a.sampleRate*.012);
  for(let c=0;c<sec*55;c++){const s0=Math.floor(Math.random()*len*.92),amp=.25+Math.random()*.5;for(let i=0;i<n&&s0+i<len;i++)d[s0+i]+=(Math.random()*2-1)*amp*Math.exp(-i/(n/4))}
  for(let i=0;i<len;i++){const t=i/len;d[i]*=t<.08?t/.08:t>.65?(1-t)/.35:1}

  q();
 },
 ensayo(){
  const secs=[{t:'Apertura',s:30,keys:OPEN.keys,hint:'Saludo, nombres, el dato gancho y de qué trata.'},...GUION.map((g,k)=>({t:g.t,s:g.s,keys:GKEYS[k],hint:g.keys.join(' · ')})),{t:'Cierre',s:30,keys:CLOSE.keys,hint:'Resumen en una frase, por qué importa ya, gracias y preguntas.'}];
  const target=secs.reduce((a,b)=>a+b.s,0);
  const host=stageShell('🌟','Ensayo general',`Toda la exposición, de principio a fin, viendo solo las ideas clave. Meta: unos ${Math.round(target/60)} minutos.`);
  host.innerHTML=`<div class="paper card center"><div class="crowd">👩‍🏫 🧑‍🎓 👨‍🎓 🧑‍🎓 👩‍🎓</div><p style="margin:8px 0">Párate como si estuvieras frente al salón. El micrófono enciende las ideas que vas diciendo.</p><div class="act"><button class="btn" id="go">🎬 ¡Acción!</button></div></div>`;
  let i=0,total=0,sec=0,tiv=null,m=null;const res=[];
  $('#go',host).onclick=()=>count(3);
  function count(n){if(!host.isConnected)return;host.innerHTML=`<div class="paper"><p class="big3">${n||'¡YA!'}</p></div>`;tone(n?'tap':'win');if(S.tts)speak(n?String(n):'¡Ya!');setTimeout(()=>n?count(n-1):start(),850)}
  function start(){if(!host.isConnected)return;tiv=setInterval(()=>{if(!host.isConnected){clearInterval(tiv);stopMic();return}total++;sec++;const a=$('#tt',host),b=$('#sct',host);if(a)a.textContent=mm(total);if(b)b.textContent=mm(sec)},1000);sect()}
  function sect(){
    stopMic();sec=0;const s=secs[i];
    host.innerHTML=`<div class="prog"><i style="width:${i/secs.length*100}%"></i></div><div class="gstat"><span>Sección ${i+1}/${secs.length}</span><span>⏱ <b id="tt">${mm(total)}</b> / ${mm(target)}</span></div>
      <div class="paper card pop"><div class="eyebrow muted">META ${s.s} s · <span id="sct">00:00</span></div><h3 style="font-size:1.6rem">${s.t}</h3><p class="muted">${s.hint}</p><div id="mic" style="margin-top:8px"></div></div>
      <div class="act"><button class="btn" id="nx">${i+1<secs.length?'Siguiente sección ▸':'🏁 Terminar exposición'}</button></div>`;
    m=micBox($('#mic',host),s.keys);const mb=$('#mb',host);if(mb)mb.click();
    $('#nx',host).onclick=()=>{res.push(m.score());m.stop();i++;if(i<secs.length)sect();else finish()};
  }
  function finish(){
    clearInterval(tiv);stopMic();const avg=res.reduce((a,b)=>a+b,0)/res.length;const stars=Math.max(1,starsOf(avg)-(total>target*1.35?1:0));
    S.expo.ensayo=Math.max(S.expo.ensayo||0,stars);S.expoOk=(S.expoOk||0)+1;save();addXP(60);
    fireworks(7);applause(4.5);burst(120);tone('win');
    host.innerHTML=`<div class="paper center pop"><div class="crowd">👏 🧑‍🎓 👩‍🏫 👨‍🎓 👏</div><h2>¡Ovación de pie!</h2><p style="font-size:2rem;color:#C9A13E;letter-spacing:4px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
      ${rows([['Tiempo total',mm(total)+' (meta '+mm(target)+')'],['Ideas clave dichas',Math.round(avg*100)+' %'],['Consejo',total>target*1.2?'Te pasaste de tiempo: resume cada columna en una frase.':total<target*.5?'Fue muy rápido: haz pausas y señala el árbol.':avg<.6?'Repite "El recorrido" con huecos y vuelve aquí.':'¡Estás listo para exponer!']])}
      <div class="act" style="margin-top:12px"><button class="btn ghost" id="again">Otra vez</button><button class="btn" id="cert">🏅 Ver mi certificado</button></div></div>`;
    $('#again',host).onclick=()=>EXPO.ensayo();$('#cert',host).onclick=()=>certificate(total,avg,stars);
  }
 }
};
function certificate(total,avg,st){
  const ov=overlay(`<div style="font-size:3rem">🏅</div><p class="eyebrow" style="color:#9A6B00">Expedición Árbol de Problemas</p><h2>Certificado de entrenamiento</h2><p>Completaste el <b>ensayo general</b> de la exposición del árbol de problemas del <b>Pasaporte Verde del Predio Amazónico</b>.</p>
    <div style="text-align:left;margin-top:10px">${rows([['Tiempo',mm(total)],['Ideas clave',Math.round(avg*100)+' %'],['Estrellas','★'.repeat(st)+'☆'.repeat(3-st)],['Fecha',new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})]])}</div>
    <p class="muted" style="margin-top:8px">Tómale captura de pantalla 📸</p><div class="act" style="margin-top:12px"><button class="btn" id="cl">¡Gracias!</button></div>`,'cert');
  $('#cl',ov).onclick=closeOv;fireworks(4);
}

/* ================= reloj de enfoque ================= */
const T={mode:'idle',left:1500,iv:null};
function drawT(){const b=$('#timer');$('#tlabel').textContent=T.mode==='idle'?'25:00':mm(T.left)+(T.mode==='paused'?' ⏸':'');b.classList.toggle('run',T.mode==='focus');b.classList.toggle('brk',T.mode==='break')}
function runT(){clearInterval(T.iv);T.iv=setInterval(()=>{T.left--;drawT();const bc=$('#bcount');if(bc)bc.textContent=mm(T.left);if(T.left<=0){clearInterval(T.iv);T.mode==='focus'?startBreak():endBreak()}},1000);drawT()}
$('#timer').onclick=()=>{
  if(T.mode==='idle'){T.left=1500;T.mode='focus';runT();toast('⏱ 25 minutos de enfoque. ¡Tú puedes!')}
  else if(T.mode==='focus'){T.mode='paused';clearInterval(T.iv);drawT();toast('Reloj en pausa')}
  else if(T.mode==='paused'){T.mode='focus';runT()}
  else if(T.mode==='break'){endBreak()}
};
function startBreak(){
  T.mode='break';T.left=300;tone('win');runT();
  const ov=overlay(`<div style="display:flex;justify-content:center">${ceiba('happy')}</div><h2 class="center">¡Descanso!</h2><p class="center">Hiciste 25 minutos de enfoque. Ahora 5 de pausa.</p><p class="clock" id="bcount">05:00</p>${list(['Levántate y estírate.','Toma agua.','Mira lejos por la ventana.','No abras redes: te roban el descanso.'])}<div class="act" style="margin-top:12px"><button class="btn ghost" id="skip">Saltar descanso</button></div>`);
  $('#skip',ov).onclick=endBreak;
}
function endBreak(){clearInterval(T.iv);T.mode='idle';T.left=1500;drawT();tone('lvl');
  const ov=overlay(`<div style="display:flex;justify-content:center">${ceiba('wow')}</div><h2 class="center">¡De vuelta!</h2><p class="center">Toca ⏱ cuando quieras empezar otros 25 minutos.</p><div class="act" style="margin-top:12px"><button class="btn" id="cl">¡Vamos!</button></div>`);$('#cl',ov).onclick=closeOv}

/* ================= panel de sonido ================= */
$('#snd').onclick=()=>{
  const ov=overlay(`<h2>🔊 Sonido</h2>
   <p style="margin-top:12px"><b>Voz de Ceibita</b> (lee cada explicación en voz alta e ilumina lo que va leyendo)</p><div class="seg" id="tts"><button data-v="1" class="${S.tts?'on':''}">Encendida</button><button data-v="0" class="${S.tts?'':'on'}">Apagada</button></div>
   <p><b>Tipo de voz</b> (las que dicen "Natural" u "Online" suenan más humanas)</p>
   <div style="display:flex;gap:8px;margin:6px 0 12px"><select id="vozSel" style="flex:1;font:700 1rem var(--body);padding:8px;border:2.5px solid var(--ink);border-radius:10px">${HAS_TTS?speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)).map(v=>`<option value="${v.name}" ${VOICE&&VOICE.name===v.name?'selected':''}>${v.name.replace(/^Microsoft /,'')}</option>`).join(''):''}</select><button class="btn small" id="probarVoz">▶ Probar</button></div>
   <p><b>Efectos de sonido</b></p><div class="seg" id="fx"><button data-v="1" class="${S.fx?'on':''}">Encendidos</button><button data-v="0" class="${S.fx?'':'on'}">Apagados</button></div>
   ${HAS_TTS?'':'<p class="muted">Este navegador no tiene voz. Prueba con Chrome o Edge.</p>'}
   <div class="act" style="margin-top:14px"><button class="btn" id="cl">Listo</button></div>`);
  $$('#tts button',ov).forEach(b=>b.onclick=()=>{S.tts=b.dataset.v==='1';save();$$('#tts button',ov).forEach(x=>x.classList.toggle('on',x===b));if(S.tts)speak('Hola, soy Ceibita.');else hush()});
  $$('#fx button',ov).forEach(b=>b.onclick=()=>{S.fx=b.dataset.v==='1';save();$$('#fx button',ov).forEach(x=>x.classList.toggle('on',x===b));tone('ok')});
  $('#cl',ov).onclick=closeOv;
  const sel=$('#vozSel',ov);
  if(sel)sel.onchange=()=>{S.vozNombre=sel.value;save();pickVoice();speak('Hola. Así suena mi voz. Vamos a entender el árbol de problemas.')};
  $('#probarVoz',ov).onclick=()=>speak('Hola. Así suena mi voz. Vamos a entender el árbol de problemas.');
};
$('#home').onclick=()=>showMap();

hud();drawT();
// El entrenamiento de la exposición no aparece en el juego: solo se abre con #entrenamiento.
if(location.hash==='#entrenamiento')SCREENS.expo();else showMap();
</script>
