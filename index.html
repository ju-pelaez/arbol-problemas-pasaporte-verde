<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Expedición Árbol de Problemas: un juego para entender el árbol de problemas del Pasaporte Verde del Predio Amazónico por actores, datos, procesos y control.">
<meta name="theme-color" content="#0E3424">
<title>Árbol de Problemas · Expedición</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap">
<style>
/* Mundo: selva amazónica de noche. Todo lo que tocas es una "calcomanía" crema con borde de tinta y sombra dura.
   Los 4 componentes del sistema tienen color fijo en todo el juego: Actores verde, Datos azul, Procesos naranja, Control dorado. */
:root{
  --night:#12402C; --night2:#0E3424; --grid:rgba(255,247,232,.05);
  --paper:#FFF7E8; --paper2:#F3E8CF; --ink:#14231B; --muted:#5C6B62; --cream:#FFF7E8;
  --act:#1E8C4E; --act-bg:#DDF3E5; --dat:#2B7BB9; --dat-bg:#DCEBF8; --pro:#D0661C; --pro-bg:#FCE6D3; --con:#B88600; --con-bg:#FBF0C8;
  --efe:#E9A21F; --efe-bg:#FDF1D3; --env:#7C8A82; --env-bg:#ECEFED; --trunk:#14532D;
  --ok:#1C9A52; --ok-bg:#D8F2E2; --bad:#DA3832; --bad-bg:#FBDBDA; --gold:#FFC23D; --pink:#FF9DB5;
  --display:"Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--night)}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh;overflow-x:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:900;letter-spacing:.01em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
b,strong{font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto}
.muted{color:var(--muted)}
.center{text-align:center}

/* hojas de fondo */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;fill:var(--cream);opacity:.06;animation:drift 28s ease-in-out infinite}
@keyframes drift{50%{transform:translateY(-30px) rotate(18deg)}}

/* calcomanías */
.paper{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px}
.btn{font-family:var(--display);font-weight:900;font-size:1.15rem;letter-spacing:.02em;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:11px 20px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn.green{background:#7ED39A}
.btn.small{font-size:.95rem;padding:6px 12px;box-shadow:0 3px 0 var(--ink);border-radius:11px}
.btn.small:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.eyebrow{font:700 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase}

/* HUD */
.hud{position:sticky;top:0;z-index:15;background:var(--night2);border-bottom:3px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
.hin{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:0;margin-right:auto;color:var(--cream)}
.logo svg{width:34px;height:34px}
.logo .lt{font-family:var(--display);font-weight:900;font-size:1.05rem;line-height:1}
.logo .lt small{display:block;font:700 .6rem var(--mono);letter-spacing:.08em;color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px 3px 7px;font:700 .85rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
button.chip{cursor:pointer}
button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.lvl .badge{width:24px;height:24px;border-radius:50%;background:var(--act);color:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:.85rem}
.lvl .info{display:grid;line-height:1.1}
.lvl .rank{font:700 .64rem var(--body);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{width:78px;height:8px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--act);transition:width .5s}
.flame.hot{background:#FFD9B8}
.flame.hot .fi{display:inline-block;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.18) rotate(-6deg)}}
.chip.run{background:#CDEFD8}
.chip.brk{background:#FFE0EA}

main{position:relative;z-index:1;padding-top:18px;padding-bottom:90px}

/* Ceibita y burbuja */
.talk{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:end;margin-bottom:14px}
.ceiba{width:96px;height:112px;overflow:visible}
.ceiba .crown{transform-origin:60px 60px;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-3deg)}}
.bubble{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;box-shadow:0 5px 0 var(--ink);padding:12px 46px 12px 14px;font-size:1.08rem;min-height:56px}
.bubble::before{content:"";position:absolute;left:-14px;bottom:10px;border:8px solid transparent;border-right:12px solid var(--ink)}
.bubble b{background:linear-gradient(transparent 55%,#FFE38A 55%)}
.spk{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink);background:var(--gold);cursor:pointer;display:grid;place-items:center;font-size:.95rem;box-shadow:0 2px 0 var(--ink)}
.w{opacity:0;animation:win .3s forwards}
@keyframes win{to{opacity:1}}

.card{margin-bottom:16px}
.card h3{font-size:1.3rem;margin-bottom:8px}
.card p+p{margin-top:8px}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* piezas de contenido */
.big{font-family:var(--display);font-weight:900;font-size:1.3rem;line-height:1.25;color:var(--trunk)}
.quote{border-left:6px solid var(--gold);background:#FFF1C9;padding:10px 12px;border-radius:0 12px 12px 0;font-weight:700}
.trunkbox{background:var(--trunk);color:#fff;border:3px solid var(--ink);outline:3px solid var(--gold);outline-offset:-7px;border-radius:14px;padding:14px 16px;font-family:var(--display);font-weight:900;font-size:1.15rem;line-height:1.3}
.rows{display:grid;gap:6px}
.rows .r{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:10px;padding:8px 10px;border-radius:10px;background:#fff;border:2px solid #E3D9C2;font-size:.97rem}
.rows .r b{color:var(--ink)}
.rows .r.c-act{border-left:7px solid var(--act)} .rows .r.c-dat{border-left:7px solid var(--dat)} .rows .r.c-pro{border-left:7px solid var(--pro)} .rows .r.c-con{border-left:7px solid var(--con)} .rows .r.c-efe{border-left:7px solid var(--efe)} .rows .r.c-env{border-left:7px solid var(--env)} .rows .r.c-trk{border-left:7px solid var(--trunk)}
.rows .r.hl{background:#FFF1C9;border-color:var(--gold)}
.li{margin:4px 0 0;padding-left:20px}
.li li{margin:3px 0}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.flow span{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:5px 9px;font-weight:700;font-size:.92rem}
.flow span:last-child{background:var(--act);color:#fff}
.flow.plain span:last-child{background:#fff;color:var(--ink)}
.flow i{font-style:normal;font-weight:700;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:640px){.cmp{grid-template-columns:repeat(4,1fr)}}
.cmp div{border-radius:12px;padding:9px 10px;border:2.5px solid var(--ink);font-size:.92rem;line-height:1.3}
.cmp div b{display:block;font-family:var(--display);font-weight:900;font-size:1.05rem;color:#fff;margin:-9px -10px 6px;padding:5px 10px;border-radius:9px 9px 0 0}
.k-act{background:var(--act-bg)} .k-act b{background:var(--act)}
.k-dat{background:var(--dat-bg)} .k-dat b{background:var(--dat)}
.k-pro{background:var(--pro-bg)} .k-pro b{background:var(--pro)}
.k-con{background:var(--con-bg)} .k-con b{background:var(--con)}
.tag{display:inline-block;color:#fff;border-radius:7px;padding:0 7px;font-weight:700;font-size:.9em}
.t-act{background:var(--act)} .t-dat{background:var(--dat)} .t-pro{background:var(--pro)} .t-con{background:var(--con)} .t-efe{background:var(--efe);color:var(--ink)} .t-env{background:var(--env)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>div{border:2.5px solid var(--ink);border-radius:12px;padding:9px 10px;font-size:.93rem}
.two .yes{background:var(--ok-bg)} .two .no{background:#EEE7F6}
.howto{display:grid;gap:8px;margin:6px 0 10px}
.howto div{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid #E3D9C2;border-radius:12px;padding:8px 10px}
.howto div b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900}
.treepic{display:grid;gap:6px;text-align:center;font-weight:700}
.treepic div{border:2.5px solid var(--ink);border-radius:12px;padding:8px}
.tp-copa{background:var(--efe-bg)} .tp-tronco{background:var(--trunk);color:#fff} .tp-raiz{background:var(--act-bg)} .tp-suelo{background:var(--env-bg);border-style:dashed!important}
.treepic small{display:block;font-weight:400}
.dik{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dik span{flex:1;min-width:100px;text-align:center;border:2.5px solid var(--dat);border-radius:10px;padding:7px;background:var(--dat-bg);font-weight:700;font-size:.92rem}
.dik span.x{border-color:var(--bad);border-style:dashed;background:#fff;color:var(--bad)}
.dik i{font-style:normal;font-weight:700}
.eps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;font-size:.88rem}
.eps>div{border:2.5px solid var(--ink);border-radius:10px;padding:7px}
.eps .ar{border:0;display:grid;place-items:center;font-weight:700;padding:0}
.eps h4{margin:0 0 3px;font:700 .72rem var(--mono);letter-spacing:.08em}
.eps .e{background:var(--dat-bg)} .eps .p{background:var(--pro-bg)} .eps .s{background:var(--efe-bg)}
.ctl{margin-top:8px;border:2.5px solid var(--ink);border-radius:10px;padding:7px;background:var(--con-bg);text-align:center;font-size:.9rem}
@media(max-width:560px){.eps{grid-template-columns:1fr}.eps .ar{transform:rotate(90deg);height:18px}}

/* mapa */
.hero{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin-bottom:16px}
.hero .ceiba{width:110px;height:128px}
.title{font-size:clamp(1.8rem,7vw,2.6rem);color:var(--cream)}
.title em{font-style:normal;color:var(--gold)}
.leaves{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.leaves i{width:22px;height:22px;border-radius:0 60% 0 60%;border:2px solid var(--cream);opacity:.35}
.leaves i.on{background:#7ED39A;border-color:var(--ink);opacity:1}
.sect{font-family:var(--display);font-weight:900;font-size:1.2rem;margin:22px 0 10px;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mcard{position:relative;text-align:left;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;transition:transform .08s,box-shadow .08s}
.mcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mcard .ic{width:44px;height:44px;border-radius:12px;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:1.4rem;background:var(--c,#fff)}
.mcard h3{font-size:1.08rem}
.mcard p{font-size:.86rem;color:var(--muted);line-height:1.3}
.mcard .st{font-size:.95rem;letter-spacing:1px;color:#C9A13E}
.mcard .nx{position:absolute;top:-11px;right:10px;background:var(--gold);border:2.5px solid var(--ink);border-radius:99px;font:700 .68rem var(--mono);padding:2px 8px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.mcard.done{background:#F1FAF3}
.mcard.boss{grid-column:1/-1;background:#FFE7A8}
.mcard .num{font:700 .66rem var(--mono);color:var(--muted);letter-spacing:.08em}
.linkbtn{background:none;border:0;color:var(--cream);opacity:.7;text-decoration:underline;cursor:pointer;font-size:.85rem}

/* minijuegos */
.gtitle{margin-bottom:12px}
.gtitle h3{font-size:1.45rem;color:var(--cream)}
.gtitle p{opacity:.85}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;min-height:20px}
.tile{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:8px 11px;box-shadow:0 3px 0 var(--ink);cursor:pointer;font-weight:700;font-size:.95rem;text-align:left;line-height:1.25;transition:transform .08s}
.tile.sel{background:var(--gold);transform:translateY(-3px)}
.tile.okk{background:var(--ok-bg);box-shadow:none;cursor:default}
.tile.gone{display:none}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.buckets.b4{grid-template-columns:repeat(4,1fr)}.buckets.b3{grid-template-columns:repeat(3,1fr)}.buckets.b5{grid-template-columns:repeat(5,1fr)}}
.bucket{background:var(--bg,#fff);border:3px solid var(--ink);border-radius:16px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.bucket .bh{background:var(--c);color:#fff;font-family:var(--display);font-weight:900;padding:6px 10px;border-radius:12px 12px 0 0;font-size:1rem}
.bucket .bin{padding:6px;display:flex;flex-direction:column;gap:5px}
.bucket .bin .tile{font-size:.8rem;padding:5px 7px;box-shadow:none}
.bucket.hint{animation:glow .8s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 6px var(--gold)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;text-align:center;font-weight:700;margin:12px 0 4px}
.fb.good{color:#9BF0B8} .fb.bad{color:#FFB3B0}
.line{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px;counter-reset:n}
.line li{counter-increment:n;background:var(--ok-bg);color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:7px 10px 7px 40px;position:relative;font-weight:700;animation:pop .3s}
.line li::before{content:counter(n);position:absolute;left:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--act);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:.85rem}
.line.empty::after{content:"Toca la primera tarjeta…";opacity:.6;font-style:italic}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.match .tile{width:100%}
.match .tile.okk{opacity:.75}
.tfcard{text-align:center;font-size:1.2rem;font-weight:700;padding:26px 18px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* batalla */
.arena{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin-bottom:14px}
.mon{width:110px;height:100px;overflow:visible}
.mon.hit{animation:hit .4s}
@keyframes hit{30%{transform:translateX(10px) rotate(8deg);filter:brightness(1.6)}}
.mon.ko{animation:ko .8s forwards}
@keyframes ko{to{transform:translateY(40px) rotate(90deg);opacity:0}}
.mname{font-family:var(--display);font-weight:900;font-size:1.25rem}
.hp{height:16px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:6px 0}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#E8533F,#F28C38);transition:width .4s}
.hearts{font-size:1.25rem;letter-spacing:2px}
.combo{font:700 .8rem var(--mono);color:var(--gold)}
.qbox{margin-bottom:12px}
.qbox .q{font-size:1.15rem;font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;font-weight:700;font-size:1rem;color:var(--ink);line-height:1.3}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:.98rem;border:2.5px solid var(--ink)}
.why.good{background:var(--ok-bg)} .why.bad{background:var(--bad-bg)}
.float{position:fixed;z-index:70;pointer-events:none;font-family:var(--display);font-weight:900;font-size:1.3rem;color:var(--gold);-webkit-text-stroke:1px var(--ink);animation:up 1s forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}

.mtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--cream);opacity:.4}
.dots i.on{background:var(--gold);border-color:var(--ink);opacity:1}
.dots i.cur{background:var(--cream);opacity:1;transform:scale(1.25)}

/* overlay, toast, confeti */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,30,20,.72);display:grid;place-items:center;padding:16px}
.ov .paper{max-width:460px;width:100%;max-height:88vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ov h2{font-size:1.7rem;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:55;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:9px 14px;font-weight:700;max-width:92vw;animation:pop .3s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg button{border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:6px 12px;cursor:pointer;font-weight:700}
.seg button.on{background:var(--gold)}
input[type=range]{width:100%;accent-color:var(--act)}

/* fichas */
.flip{perspective:900px;cursor:pointer;min-height:150px}
.flip .in{position:relative;width:100%;min-height:150px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:12px;display:grid;place-items:center;text-align:center;color:var(--ink)}
.flip .f{background:var(--paper);font-family:var(--display);font-weight:900;font-size:1.25rem}
.flip .b{background:var(--act-bg);transform:rotateY(180deg);font-size:.95rem;line-height:1.35}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

/* exposición */
.expo .stepn{font:700 .75rem var(--mono);letter-spacing:.1em;color:var(--muted)}
.expo .say{font-size:1.18rem;line-height:1.5;font-style:italic;margin:8px 0}
.keys{display:grid;gap:7px;margin:10px 0}
.keys span{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:8px 10px;font-weight:700}
.clock{font:700 2rem var(--mono);text-align:center}
.clock small{font-size:.9rem;color:var(--muted)}
.prog{height:10px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--act);transition:width .3s}

/* ===== mundo para caminar ===== */
.world{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 6px 0 var(--ink);background:#071A28;touch-action:none;user-select:none;-webkit-user-select:none}
.world canvas{display:block;width:100%;height:min(58vh,430px);cursor:pointer}
.pad{display:grid;grid-template-columns:62px 62px 1fr 62px;gap:8px;margin-top:10px}
.pad button{height:58px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);font-size:1.4rem;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active,.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pad .go{background:var(--gold);font-family:var(--display);font-weight:900;font-size:1rem;padding:0 8px;line-height:1.1}
.pad .go:disabled{opacity:.55;background:var(--paper)}
.whelp{font-size:.82rem;opacity:.8;text-align:center;margin-top:6px}
details.lst summary{cursor:pointer;font-family:var(--display);font-weight:900;color:var(--gold);font-size:1.1rem;margin:18px 0 10px}
.fact{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:56;width:min(92vw,520px);background:#FFF1C9;color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;font-weight:700;animation:pop .35s}
.fact small{display:block;font:700 .7rem var(--mono);color:#9A6B00;letter-spacing:.08em}

/* ===== minijuegos de acción ===== */
.gcv{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--ink);touch-action:none;background:#0B2A3A}
.gcv canvas{display:block;width:100%;height:min(58vh,420px);cursor:none}
.gcv.lluvia canvas{height:min(64vh,480px);cursor:pointer}
.gstat{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 2px;font:700 .95rem var(--mono)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{min-height:96px;border:3px solid var(--ink);border-radius:14px;background:var(--act);color:#fff;box-shadow:0 4px 0 var(--ink);cursor:pointer;font-weight:700;font-size:.9rem;padding:8px;display:grid;place-items:center;text-align:center;line-height:1.25;transition:background .2s}
.mc .t{display:none}.mc .bk{font-size:1.9rem}
.mc.up,.mc.got{background:var(--paper);color:var(--ink);animation:pop .3s}
.mc.up .t,.mc.got .t{display:block}.mc.up .bk,.mc.got .bk{display:none}
.mc.got{background:var(--ok-bg);cursor:default;box-shadow:none}
.mc.a .t{font-family:var(--display);font-weight:900;font-size:1.05rem}
.speed .stmt{font-size:1.12rem;font-weight:700}
.speed .ans{display:block;margin-top:8px;font-size:1.05rem;background:#FFF1C9;border:2.5px dashed var(--ink);border-radius:10px;padding:8px}
.tbar{height:12px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#1E8C4E,#FFC23D);transition:width .2s linear}

/* ===== construir el árbol ===== */
.build{display:grid;gap:8px}
.zone{border:3px dashed var(--ink);border-radius:14px;padding:6px;min-height:58px;color:var(--ink);background:var(--bg,#fff);transition:transform .1s;cursor:pointer}
.zone .zh{font:700 .66rem var(--mono);letter-spacing:.04em;display:flex;justify-content:space-between;gap:4px;color:var(--c,#14231B)}
.zone .zin{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.zone .zin span{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:3px 6px;font-size:.72rem;font-weight:700;line-height:1.2;animation:pop .3s}
.zone.over{transform:scale(1.03);border-style:solid;box-shadow:0 0 0 4px var(--gold)}
.zone.full{border-style:solid}
.zone.hint{animation:glow .8s ease-in-out 3}
.zrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btrunk{background:var(--trunk);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;font-family:var(--display);font-weight:900;font-size:.92rem;text-align:center;line-height:1.25}
.tray{position:sticky;bottom:8px;z-index:5;display:grid;gap:8px;background:rgba(14,52,36,.94);border:3px solid var(--ink);border-radius:16px;padding:8px;margin-top:10px}
.tray .tile{touch-action:none;cursor:grab;width:100%}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-70%) rotate(-3deg);max-width:260px;opacity:.95}

/* ===== teatro de la exposición ===== */
.stage{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 6px 0 var(--ink);padding:22px 14px 18px;background:radial-gradient(ellipse at 50% 0%,rgba(255,240,180,.42),transparent 62%),linear-gradient(#2a1033,#14081a);color:var(--cream)}
.stage::before,.stage::after{content:"";position:absolute;top:0;bottom:0;width:30px;background:repeating-linear-gradient(90deg,#9d1d2c 0 9px,#7a1220 9px 16px);box-shadow:inset -6px 0 10px rgba(0,0,0,.35)}
.stage::before{left:0}.stage::after{right:0;transform:scaleX(-1)}
.stage>*{position:relative;z-index:1;margin-left:24px;margin-right:24px}
.stage h2{font-size:clamp(1.5rem,6vw,2.2rem);text-align:center;color:var(--gold)}
.sgrid{display:grid;gap:10px;margin-top:14px}
.scard{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;cursor:pointer}
.scard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.scard .ic{font-size:1.6rem;text-align:center}
.scard h3{font-size:1.05rem}.scard p{font-size:.82rem;color:var(--muted);line-height:1.3}
.scard .st{color:#C9A13E;letter-spacing:1px;white-space:nowrap}
.mic{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2.5px solid var(--ink);border-radius:99px;background:#fff;padding:5px 11px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--ink)}
.chips button.hit{background:#7ED39A;animation:pop .3s}
.live{min-height:2.6em;font-style:italic;color:var(--muted);font-size:.9rem;background:#fff;border:2px dashed #CDBF9F;border-radius:10px;padding:6px 9px;max-height:7em;overflow:auto}
.btn.rec{background:#FF8A80}
.btn .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#C62828;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.prompter{font-size:1.18rem;line-height:1.55;font-weight:700;color:var(--ink)}
.prompter .fd{color:#7A705C;letter-spacing:.04em}
.breath{width:170px;height:170px;margin:14px auto;border-radius:50%;background:radial-gradient(circle,#7ED39A,#1E8C4E);border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.3rem;color:#fff;transform:scale(.6);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
.ptree{display:grid;gap:6px;margin-top:10px}
.ptree button{border:3px solid var(--ink);border-radius:12px;font-weight:700;cursor:pointer;padding:12px 6px;font-size:.92rem;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.ptree .r4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pz-copa{background:var(--efe-bg)}.pz-tronco{background:var(--trunk);color:#fff!important}.pz-suelo{background:var(--env-bg);border-style:dashed!important}
.pz-act{background:var(--act-bg)}.pz-dat{background:var(--dat-bg)}.pz-pro{background:var(--pro-bg)}.pz-con{background:var(--con-bg)}
.ptree button.right{outline:5px solid var(--ok)}.ptree button.wrong{outline:5px solid var(--bad)}
.simon{text-align:center}
.simon .gest{font-size:4.5rem;line-height:1.1;margin:6px 0}
.simon .says{font-family:var(--display);font-weight:900;font-size:1.7rem}
.cert{text-align:center;border:6px double #C9A13E!important;background:linear-gradient(#FFFBEF,#FFF1C9)!important}
.cert h2{color:var(--trunk)}
#fw{position:fixed;inset:0;z-index:58;pointer-events:none}
.crowd{font-size:1.8rem;text-align:center;letter-spacing:4px;animation:bob .6s ease-in-out infinite}
.big3{font-family:var(--display);font-weight:900;font-size:5rem;line-height:1;text-align:center;color:var(--ink)}

.cine{position:fixed;inset:0;z-index:95;background:#06120E;animation:cineEntra .55s cubic-bezier(.6,0,.3,1) both}
.cine.sale{animation:cineSale .35s ease both}
.cine iframe{display:block;width:100%;height:100%;border:0}
@keyframes cineEntra{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
@keyframes cineSale{to{opacity:0}}
.leyendo{position:relative;z-index:2;box-shadow:0 0 0 4px #FFC23D,0 0 26px rgba(255,194,61,.6)!important;border-radius:12px;transform:scale(1.015);transition:box-shadow .25s,transform .25s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.w{opacity:1}}

/* enlazar: hilos SVG entre tarjetas y grupos */
.enlazar{position:relative;display:grid;grid-template-columns:1fr .8fr;gap:clamp(40px,10vw,120px);align-items:center;min-height:300px;padding:6px 0}
.enlazar .hilos{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.ecol{display:grid;gap:10px;align-content:center}
.ecarta{position:relative;width:100%;touch-action:none;cursor:grab;animation:entraCarta .4s cubic-bezier(.22,1,.36,1) both}
.ecarta:nth-child(2){animation-delay:.05s}.ecarta:nth-child(3){animation-delay:.1s}.ecarta:nth-child(4){animation-delay:.15s}
@keyframes entraCarta{from{opacity:0;transform:translateX(-14px);filter:blur(4px)}}
.ecarta .pto,.socket .pto{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--gold);border:2.5px solid var(--ink)}
.ecarta .pto{right:-9px}.socket .pto{left:-9px;background:var(--c)}
.ecarta.viaja{transition:transform .5s cubic-bezier(.65,0,.35,1),opacity .5s;transform:translate(var(--vx),var(--vy)) scale(.4);opacity:0}
.socket{position:relative;display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;min-height:64px;padding:10px 14px 10px 18px;border:3px solid var(--ink);border-radius:16px;background:var(--bg);color:var(--ink);font:inherit;font-weight:900;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .15s cubic-bezier(.22,1,.36,1)}
.socket b{color:var(--c)}
.socket .n{min-width:30px;height:30px;border-radius:99px;display:grid;place-items:center;background:var(--c);color:#fff;font-size:.9rem}
.socket.over{transform:scale(1.04);outline:4px solid var(--gold)}
.socket.pista{outline:4px dashed var(--ok)}
.socket.recibe{animation:recibe .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes recibe{40%{transform:scale(1.07)}}
.hilo{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round}
.hilo.tirando{stroke-dasharray:2 10;animation:corre .5s linear infinite}
@keyframes corre{to{stroke-dashoffset:-24}}
.hilo.dibuja{stroke-dasharray:1200;stroke-dashoffset:1200;animation:traza .35s cubic-bezier(.22,1,.36,1) forwards}
@keyframes traza{to{stroke-dashoffset:0}}
.hilo.bien{stroke-width:7}
.hilo.mal{stroke:var(--bad);animation:tiembla .3s 2}
@keyframes tiembla{25%{transform:translateY(-4px)}75%{transform:translateY(4px)}}
.hilo.sale,.hilo.suelta{transition:opacity .3s;opacity:0}
.zone.recibe{animation:recibe .45s cubic-bezier(.34,1.56,.64,1)}
@media (max-width:560px){.enlazar{grid-template-columns:1fr .85fr;gap:34px}.socket{min-height:54px;padding:8px 10px 8px 14px;font-size:.85rem}.ecarta{font-size:.82rem}}
@media (prefers-reduced-motion:reduce){.ecarta,.ecarta.viaja,.socket.recibe,.zone.recibe,.hilo{animation:none!important;transition:none!important}}

/* armar: el tablero tiene forma de árbol */
.build.arbolito{justify-items:center;gap:10px}
.arbolito .capa{animation:entraCarta .45s cubic-bezier(.22,1,.36,1) both}
.arbolito .capa:nth-child(2){animation-delay:.06s}.arbolito .capa:nth-child(3){animation-delay:.12s}.arbolito .capa:nth-child(4){animation-delay:.18s}
.arbolito .capa.copa .zone{border-radius:999px 999px 26px 26px / 60px 60px 26px 26px;border-style:solid;background:radial-gradient(120% 140% at 50% 0%,#fff 0%,var(--bg) 55%);padding:10px 18px 8px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.arbolito .capa.copa .zone .zh{justify-content:center;gap:10px;font-size:.72rem}
.arbolito .ctronco{width:34%;min-width:170px;background:linear-gradient(90deg,#6B4426,#8A5A34 50%,#6B4426);border-radius:10px;padding:10px;position:relative}
.arbolito .capa.raiz .zone{border-radius:12px 12px 26px 26px;border-style:dashed}
.arbolito .zone.full{border-style:solid}
</style>

<script>
/* ================= utilidades ================= */
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const fmt=t=>String(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain=h=>{const d=document.createElement('div');d.innerHTML=String(h||'').replace(/\*\*/g,'').replace(/<\/(div|li|p|h3|h4|span|b)>/g,'$&. ').replace(/<i>→<\/i>/g,', ');return d.textContent.replace(/\s+/g,' ').replace(/(\s*\.\s*){2,}/g,'. ').trim()};
const mm=s=>String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.max(0,s)%60).padStart(2,'0');

/* ================= estado ================= */
const KEY='arbol-sistemas-v1';
let S={xp:0,stars:{},err:[],streak:0,best:0,tts:true,fx:true,noise:'off',vol:.35,expoOk:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S.seeds=S.seeds||[];S.noise='off';S.expo=S.expo||{};S.caps=S.caps||{};if(typeof S.px!=='number')S.px=120;

/* ================= sonido ================= */
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function tone(kind){
  if(!S.fx)return;const a=ac();if(!a)return;
  const seq={ok:[[660,.08],[880,.13]],bad:[[230,.14],[170,.2]],tap:[[540,.04]],win:[[523,.1],[659,.1],[784,.1],[1047,.28]],lvl:[[392,.09],[523,.09],[659,.09],[784,.09],[1047,.32]],place:[[700,.05],[940,.07]],pop:[[190,.05],[120,.07]]}[kind]||[[440,.1]];
  let t=a.currentTime;
  seq.forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();o.type=kind==='bad'?'square':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='bad'?.07:.17,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03);t+=d*.9});
}
let NZ=null,NG=null;
function setNoise(kind){
  S.noise=kind;save();
  if(NZ){try{NZ.stop()}catch(e){}NZ=null}
  if(kind==='off')return;const a=ac();if(!a)return;
  const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  if(kind==='brown'){let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5}}
  else{let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}}
  NZ=a.createBufferSource();NZ.buffer=buf;NZ.loop=true;NG=a.createGain();NG.gain.value=S.vol*.5;NZ.connect(NG).connect(a.destination);NZ.start();
}
function setVol(v){S.vol=v;save();if(NG)NG.gain.value=v*.5}
document.addEventListener('pointerdown',()=>{if(S.noise!=='off'&&!NZ)setNoise(S.noise)},{once:true});

/* voz en español */
const HAS_TTS='speechSynthesis' in window;let VOICE=null;
// Busco la voz más natural del computador: primero las neuronales ("Natural"/"Online", como Salome en Edge),
// y entre ellas, español de Colombia.
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));
  const p=v=>(/natural|online|neural/i.test(v.name)?100:0)+(/es[-_]CO/i.test(v.lang)?30:/es[-_](MX|US|419)/i.test(v.lang)?20:/es[-_]ES/i.test(v.lang)?10:0)+(/google/i.test(v.name)?15:0);
  VOICE=(S.vozNombre&&vs.find(v=>v.name===S.vozNombre))||vs.sort((a,b)=>p(b)-p(a))[0]||null}catch(e){}}
if(HAS_TTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
// Voz calmada: un poco más lenta que lo normal para que se entienda bien.
function utter(t){t=String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'').replace(/\s+/g,' ').trim();const u=new SpeechSynthesisUtterance(t);u.lang=VOICE?VOICE.lang:'es-CO';if(VOICE)u.voice=VOICE;u.rate=.93;u.pitch=1;return u}
function speak(t){if(!HAS_TTS||!t)return;try{hush();speechSynthesis.speak(utter(t))}catch(e){}}
function hush(){if(HAS_TTS)try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.leyendo').forEach(x=>x.classList.remove('leyendo'))}
// Lectura iluminada: lee los bloques uno por uno y resalta el que está sonando (como karaoke).
function leerBloques(bloques){
  if(!HAS_TTS)return;hush();
  bloques.forEach(({el,texto})=>{if(!texto)return;const u=utter(texto);
    u.onstart=()=>{document.querySelectorAll('.leyendo').forEach(x=>x.classList.remove('leyendo'));if(el&&el.isConnected){el.classList.add('leyendo');el.scrollIntoView({block:'nearest',behavior:'smooth'})}};

// Parte una tarjeta en bloques que se leen por separado: filas, puntos de lista, cajas, párrafos.
function bloquesDe(card){
  if(!card)return[];
  const sel='.rows .r, li, .howto > div, .treepic > div, .cmp > div, .two > div, .flow, .dik, .eps, .ctl, .quote, .trunkbox, .big, p, h3';
  const els=[...card.querySelectorAll(sel)];
  const fuera=els.filter(el=>!els.some(o=>o!==el&&o.contains(el)));
  return (fuera.length?fuera:[card]).map(el=>({el,texto:plain(el.innerHTML)})).filter(b=>b.texto);
}

const RANKS=['Semilla','Brote','Plántula','Arbusto','Árbol joven','Árbol frondoso','Ceiba','Guardián del bosque','Analista de sistemas','Analista experto'];
const PER=120, lvlOf=x=>1+Math.floor(x/PER);
function hud(){
  const l=lvlOf(S.xp);$('#lvlNum').textContent=l;$('#rank').textContent=RANKS[Math.min(l-1,RANKS.length-1)];
  $('#xpfill').style.width=(S.xp%PER/PER*100)+'%';$('#streak').textContent=S.streak;$('#flame').classList.toggle('hot',S.streak>=3);
  $('#starsTot').textContent=Object.values(S.stars).reduce((a,b)=>a+b,0);
}
function addXP(n,from){
  const before=lvlOf(S.xp);S.xp+=n;save();hud();
  if(from){const r=from.getBoundingClientRect();const f=document.createElement('div');f.className='float';f.textContent='+'+n+' XP';f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
  const l=lvlOf(S.xp);if(l>before){tone('lvl');burst(60);toast('¡Nivel '+l+'! Ahora eres '+RANKS[Math.min(l-1,RANKS.length-1)]+' 🌳')}
}
let toastT=null;
function toast(msg){$$('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2800)}
function burst(n=40){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';
  for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=pick(['#FFC23D','#1E8C4E','#2B7BB9','#D0661C','#FF9DB5','#FFF7E8']);p.style.animationDelay=(Math.random()*.35)+'s';p.style.setProperty('--x',(Math.random()*220-110)+'px');box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2400);
}

function wordsIn(el,text){
  const parts=String(text).split(/(\*\*.+?\*\*)/g);let n=0,h='';
  parts.forEach(p=>{const bold=/^\*\*/.test(p);const ws=p.replace(/\*\*/g,'').split(/(\s+)/);ws.forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){h+=w;return}h+=`<span class="w" style="animation-delay:${(n++)*28}ms">${bold?'<b>'+w+'</b>':w}</span>`})});
  el.innerHTML=h;
}

/* ================= misión ================= */
function playMission(m){
  let i=0;const ctx={m,errors:0};
  const el=scene(`<div class="mtop"><button class="btn small ghost" id="back">← Mapa</button><div class="dots">${m.steps.map(()=>'<i></i>').join('')}</div></div><div id="step"></div>`);
  $('#back',el).onclick=()=>showMap();
  const host=$('#step',el), dots=$$('.dots i',el);
  function next(){
    if(i>=m.steps.length)return finish();
    dots.forEach((d,k)=>{d.classList.toggle('on',k<i);d.classList.toggle('cur',k===i)});
    host.innerHTML='';hush();window.scrollTo(0,0);
    const st=m.steps[i];RUN[st.t](host,st,ctx,()=>{i++;next()});
  }
  function finish(){
    const stars=ctx.errors===0?3:ctx.errors<=2?2:1, prev=S.stars[m.id]||0;
    S.stars[m.id]=Math.max(prev,stars);save();addXP(30+stars*10);hud();tone('win');burst(80);
    const nx=nextMission();
    scene(`<div class="paper center pop"><div style="display:flex;justify-content:center">${ceiba('wow')}</div><h2>¡Misión completa!</h2><p style="font-size:2rem;color:#C9A13E;letter-spacing:4px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p>
      <p>${stars===3?'Perfecto, sin errores. Eso ya es tuyo.':stars===2?'Muy bien. Lo que fallaste quedó en tu banco de errores.':'Ganaste. Repasa el banco de errores en un rato y vuelve a intentarlo.'}</p>
      <p class="muted" style="margin-top:6px">${m.title}: +${30+stars*10} XP</p>
      <div class="act" style="margin-top:16px"><button class="btn ghost" id="map">Mapa</button><button class="btn ghost" id="mov">🕺 Ceibita dice</button>${nx?`<button class="btn" id="nxm">Siguiente: ${nx.title} →</button>`:'<button class="btn" id="verArbol">🌳 Ver mi árbol completo</button>'}</div></div>`);
    $('#mov').onclick=()=>SCREENS.mover();
    $('#map').onclick=()=>showMap(stars===3?'¡Tres estrellas! Sigue con la siguiente.':'Bien hecho. Ese tema ya tiene raíces en tu cabeza.');
    if(nx)$('#nxm').onclick=()=>playMission(nx);else $('#verArbol').onclick=()=>SCREENS.arbol();
  }
  next();
}

/* ---------- minijuego: lluvia de tarjetas ----------
   Cada tarjeta cae del cielo. El jugador la mueve de columna (← →, 1-5 o tocando la columna)
   para que caiga en su caja. ↓ o tocar dos veces la misma columna la suelta rápido.
   Si cae en la caja equivocada se pierde un corazón y la tarjeta vuelve a salir más tarde:
   para ganar hay que ubicarlas TODAS bien. */
RUN.sort=(host,st,ctx,done)=>{
  const B=st.buckets,n=B.length,total=st.items.length;
  host.innerHTML=`<div class="gtitle"><span class="eyebrow" style="color:var(--gold)">Minijuego · Lluvia de tarjetas 🌧️</span><h3>${st.title}</h3>

    <div class="gstat"><span id="lq">🃏 0/${total}</span><span id="lc"></span><span id="lp">⭐ 0</span><span id="lh">❤️❤️❤️</span></div>
    <div class="gcv lluvia"><canvas></canvas></div><p class="fb" aria-live="polite"></p><div class="act" id="la"></div>`;
  const cv=$('canvas',host),g=cv.getContext('2d');let cw=1,ch=1;
  const size=()=>{const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cw=Math.max(1,r.width);ch=Math.max(1,r.height);cv.width=cw*d;cv.height=ch*d;g.setTransform(d,0,0,d,0,0)};size();
  const fb=$('.fb',host),say=(m,c)=>{fb.textContent=m;fb.className='fb '+(c||'')};
  const FONT='700 15px "Nunito",system-ui,sans-serif',BH=74;
  let cola=shuffle(st.items.map((it,k)=>({...it,k}))),bien=0,vidas=3,puntos=0,combo=0,carta=null,espera=.4,run=true,last=performance.now(),t=0;
  let parts=[],textos=[],sacude=0,brillo={},primera=true,arrastrando=false,ultimoToque=0;
  const colW=()=>cw/n,colX=i=>colW()*(i+.5),ix=b=>B.findIndex(x=>x.id===b);
  const upd=()=>{$('#lq',host).textContent=`🃏 ${bien}/${total}`;$('#lp',host).textContent=`⭐ ${puntos}`;$('#lc',host).textContent=combo>=2?`🔥 x${combo}`:'';$('#lh',host).textContent='❤️'.repeat(Math.max(0,vidas))+'🤍'.repeat(3-Math.max(0,vidas))};
  function nueva(){
    if(!cola.length){carta=null;return}
    const it=cola.shift();g.font=FONT;
    const maxW=Math.min(cw*.92,Math.max(colW()*1.5,210));
    const lineas=wrapT(g,it.text,maxW-26);
    const w=Math.min(maxW,Math.max(...lineas.map(l=>g.measureText(l).width))+28),h=lineas.length*19+20;
    const col=Math.floor(Math.random()*n);
    carta={it,lineas,w,h,col,x:colX(col),y:-h-6,vy:Math.min(150,62+bien*5),rapida:false};
    if(primera){primera=false;say('Muévela con ← → o tocando la columna. Suéltala con ↓.','')}
  }
  function mover(dir){if(!carta)return;carta.col=Math.max(0,Math.min(n-1,carta.col+dir));tone('tap')}
  function irA(c){if(!carta)return;if(c===carta.col){carta.rapida=true;return}carta.col=c;tone('tap')}
  function explotar(x,y,color,cuantas){for(let i=0;i<cuantas;i++){const a=Math.random()*Math.PI*2,v=80+Math.random()*260;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,vida:1,color,r:2+Math.random()*3})}}
  function aterrizar(){
    const c=carta,ok=B[c.col].id===c.it.b,yb=ch-BH;carta=null;espera=.35;
    if(ok){
      bien++;combo++;const p=10+Math.min(combo,6)*2;puntos+=p;tone(combo>=3?'win':'place');addXP(3);
      explotar(colX(c.col),yb,B[c.col].c,26);textos.push({x:colX(c.col),y:yb-20,txt:`+${p}`,vida:1});
      brillo[c.col]=.6;say(combo>=3?`¡Combo x${combo}! ${c.it.text} ✔`:pick(['¡Bien!','¡Exacto!','¡Eso es!'])+' '+c.it.text+' ✔','good');
    }else{
      vidas--;combo=0;tone('bad');sacude=.35;explotar(colX(c.col),yb,'#DA3832',18);
      const k=ix(c.it.b);brillo[k]=1.4;
      say(`"${c.it.text}" va en ${B[k].label}. ${c.it.why||'Vuelve a salir más adelante.'}`,'bad');
      cola.splice(Math.min(cola.length,1+Math.floor(Math.random()*3)),0,c.it);   // vuelve a salir pronto
    }
    upd();
    if(bien>=total)return fin(true);
    if(vidas<=0)return fin(false);
  }
  // controles
  const kd=e=>{if(!run)return;const k=e.key;
    if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();mover(-1)}
    else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();mover(1)}
    else if(k==='ArrowDown'||k==='s'||k==='S'||k===' '){e.preventDefault();if(carta)carta.rapida=true}
    else if(/^[1-9]$/.test(k)&&+k<=n){e.preventDefault();irA(+k-1)}};
  addEventListener('keydown',kd);
  const colDe=e=>{const r=cv.getBoundingClientRect();return Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left)/(r.width/n))))};
  cv.addEventListener('pointerdown',e=>{ac();arrastrando=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}const c=colDe(e),ahora=performance.now();
    if(carta&&c===carta.col&&ahora-ultimoToque<350)carta.rapida=true;else irA(c);ultimoToque=ahora});
  cv.addEventListener('pointermove',e=>{if(arrastrando&&carta){const c=colDe(e);if(c!==carta.col){carta.col=c;tone('tap')}}});
  cv.addEventListener('pointerup',()=>{arrastrando=false});
  const parar=()=>{run=false;removeEventListener('keydown',kd)};

  function dibujar(){
    g.save();
    if(sacude>0)g.translate((Math.random()-.5)*14*sacude,(Math.random()-.5)*10*sacude);
    const fondo=g.createLinearGradient(0,0,0,ch);fondo.addColorStop(0,'#0B2A3A');fondo.addColorStop(1,'#123F2D');g.fillStyle=fondo;g.fillRect(-20,-20,cw+40,ch+40);
    // estrellas
    for(let i=0;i<22;i++){g.globalAlpha=.25+.25*Math.sin(t*2+i);g.fillStyle='#FFF7E8';g.beginPath();g.arc((i*137)%cw,(i*71)%(ch*.6),1.4,0,7);g.fill()}g.globalAlpha=1;
    // carriles
    for(let i=0;i<n;i++){
      const x=i*colW(),activo=carta&&carta.col===i;
      g.fillStyle=B[i].c;g.globalAlpha=activo?.16:.06;g.fillRect(x,0,colW(),ch-BH);g.globalAlpha=1;
      if(i>0){g.strokeStyle='rgba(255,247,232,.12)';g.lineWidth=1;g.setLineDash([6,8]);g.beginPath();g.moveTo(x,0);g.lineTo(x,ch-BH);g.stroke();g.setLineDash([])}
    }
    // cajas
    for(let i=0;i<n;i++){
      const x=i*colW()+4,y=ch-BH+4,w=colW()-8,h=BH-8,b=brillo[i]||0;
      if(b>0){g.shadowColor=B[i].c;g.shadowBlur=30*Math.min(1,b)}
      rr(g,x,y,w,h,14);g.fillStyle=B[i].c;g.fill();g.shadowBlur=0;
      g.lineWidth=3;g.strokeStyle=b>0?'#FFC23D':'#14231B';g.stroke();
      g.fillStyle='#fff';g.font='900 15px "Nunito",sans-serif';g.textAlign='center';g.textBaseline='middle';
      const ls=wrapT(g,B[i].label,w-14).slice(0,2);ls.forEach((l,k)=>g.fillText(l,x+w/2,y+h/2+(k-(ls.length-1)/2)*17));
      if(n<=5){g.font='700 11px "Nunito",monospace';g.fillStyle='rgba(255,255,255,.75)';g.fillText(String(i+1),x+12,y+12)}
    }
    // guía de la tarjeta
    if(carta){
      const cx=colX(carta.col);
      g.strokeStyle=B[carta.col].c;g.globalAlpha=.55;g.lineWidth=2;g.setLineDash([4,7]);g.beginPath();g.moveTo(cx,carta.y+carta.h);g.lineTo(cx,ch-BH);g.stroke();g.setLineDash([]);g.globalAlpha=1;
      g.save();g.translate(carta.x,carta.y);
      g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=14;g.shadowOffsetY=6;
      rr(g,-carta.w/2,0,carta.w,carta.h,12);g.fillStyle='#FFF7E8';g.fill();g.shadowBlur=0;g.shadowOffsetY=0;
      g.lineWidth=3;g.strokeStyle=carta.rapida?'#FFC23D':'#14231B';g.stroke();
      g.fillStyle='#14231B';g.font=FONT;g.textAlign='center';g.textBaseline='middle';
      carta.lineas.forEach((l,k)=>g.fillText(l,0,20+k*19-4));
      g.restore();
    }
    // partículas y textos
    for(const p of parts){g.globalAlpha=Math.max(0,p.vida);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}
    g.globalAlpha=1;
    for(const x of textos){g.globalAlpha=Math.max(0,x.vida);g.fillStyle='#FFC23D';g.font='900 22px "Nunito",sans-serif';g.textAlign='center';g.strokeStyle='#14231B';g.lineWidth=4;g.strokeText(x.txt,x.x,x.y);g.fillText(x.txt,x.x,x.y)}
    g.globalAlpha=1;g.restore();
  }
  function ciclo(ahora){
    if(!run)return;if(!cv.isConnected){parar();return}
    const dt=Math.min(.05,(ahora-last)/1000);last=ahora;t+=dt;
    if(!carta){espera-=dt;if(espera<=0)nueva()}
    if(carta){
      carta.x+=(colX(carta.col)-carta.x)*Math.min(1,dt*16);
      carta.y+=(carta.rapida?560:carta.vy)*dt;
      if(carta.y+carta.h>=ch-BH)aterrizar();
    }
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.vida-=dt*1.4}
    parts=parts.filter(p=>p.vida>0);
    for(const x of textos){x.y-=50*dt;x.vida-=dt*1.2}
    textos=textos.filter(x=>x.vida>0);
    for(const k in brillo){brillo[k]-=dt;if(brillo[k]<=0)delete brillo[k]}
    if(sacude>0)sacude=Math.max(0,sacude-dt);
    dibujar();
    if(run)requestAnimationFrame(ciclo);
  }
  function fin(gano){
    parar();dibujar();const a=$('#la',host);
    if(gano){burst(50);tone('win');say(`¡Todo en su lugar! ${puntos} puntos 🌳`,'good');a.innerHTML='<button class="btn" id="nx">¡Listo! →</button>';$('#nx',a).onclick=()=>{tone('tap');done()}}
    else{say('¡Casi! Se acabaron los corazones. Las que fallaste ahora ya sabes dónde van.','bad');a.innerHTML='<button class="btn" id="rt">Otra vez</button>';$('#rt',a).onclick=()=>RUN.sort(host,st,ctx,done)}
  }
  upd();requestAnimationFrame(ciclo);
};

/* ---------- minijuegos de clasificar: cuatro formas distintas ----------
   Cada paso de clasificar trae "modo": 'enlazar', 'armar', 'lanzar' o 'lluvia' (por defecto).
   Así cada misión se juega diferente, pero todas enseñan lo mismo: poner cada cosa en su lugar. */
RUN.lluvia=RUN.sort;
RUN.sort=(host,st,ctx,done)=>({enlazar:RUN.enlazar,armar:RUN.armar,lanzar:RUN.lanzar}[st.modo]||RUN.lluvia)(host,st,ctx,done);

// Ceibita dibujada en canvas (la usan los juegos de movimiento).
function dibujaCeibita(g,x,y,fase,esc=1,rojo=false){
  g.save();g.translate(x,y);g.scale(esc,esc);
  const sw=Math.sin(fase)*9,bob=Math.abs(Math.sin(fase))*3;
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,2,18,5,0,0,7);g.fill();
  g.strokeStyle='#14231B';g.lineCap='round';g.lineWidth=5;
  g.beginPath();g.moveTo(-6,-16-bob);g.lineTo(-6+sw,0);g.moveTo(6,-16-bob);g.lineTo(6-sw,0);g.stroke();
  g.lineWidth=4;g.beginPath();g.moveTo(-12,-32-bob);g.lineTo(-21,-24-sw*.5-bob);g.moveTo(12,-32-bob);g.lineTo(21,-24+sw*.5-bob);g.stroke();
  rr(g,-13,-46-bob,26,32,8);g.fillStyle=rojo?'#E5484D':'#A9743F';g.fill();g.lineWidth=3;g.stroke();
  [[-15,-52,14,'#3FA35B'],[15,-52,14,'#3FA35B'],[0,-64,18,'#4DB86A']].forEach(([cx,cy,r,c])=>{g.beginPath();g.arc(cx,cy-bob,r,0,7);g.fillStyle=c;g.fill();g.stroke()});
  g.fillStyle='#14231B';[-2,8].forEach(ex=>{g.beginPath();g.arc(ex,-36-bob,2.6,0,7);g.fill()});
  g.lineWidth=2;g.beginPath();g.arc(3,-30-bob,4,.2,Math.PI-.2);g.stroke();
  g.restore();
}

// Partes comunes de los juegos de clasificar: marcador, mensajes y final.
function marcoClasificar(host,st,titulo,ayuda){
  const total=st.items.length;
  host.innerHTML=`<div class="gtitle"><span class="eyebrow" style="color:var(--gold)">${titulo}</span><h3>${st.title}</h3><p>${ayuda}</p></div>
    <div class="gstat"><span id="lq">🃏 0/${total}</span><span id="lc"></span><span id="lp">⭐ 0</span><span id="lh">❤️❤️❤️</span></div>
    <div class="gcv lluvia"><canvas></canvas></div><p class="fb" aria-live="polite"></p><div class="act" id="la"></div>`;
  const cv=$('canvas',host),g=cv.getContext('2d');
  const tam={cw:1,ch:1};
  const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);tam.cw=Math.max(1,r.width);tam.ch=Math.max(1,r.height);cv.width=tam.cw*d;cv.height=tam.ch*d;g.setTransform(d,0,0,d,0,0);
  const fb=$('.fb',host);
  const E={cv,g,tam,total,bien:0,vidas:3,puntos:0,combo:0,run:true,
    cola:shuffle(st.items.map((it,k)=>({...it,k}))),
    say(m,c){fb.textContent=m;fb.className='fb '+(c||'')},
    upd(){$('#lq',host).textContent=`🃏 ${E.bien}/${total}`;$('#lp',host).textContent=`⭐ ${E.puntos}`;$('#lc',host).textContent=E.combo>=2?`🔥 x${E.combo}`:'';$('#lh',host).textContent='❤️'.repeat(Math.max(0,E.vidas))+'🤍'.repeat(3-Math.max(0,E.vidas))},
    acierto(texto){E.bien++;E.combo++;const p=10+Math.min(E.combo,6)*2;E.puntos+=p;tone(E.combo>=3?'win':'place');addXP(3);
      E.say((E.combo>=3?`¡Combo x${E.combo}! `:pick(['¡Bien! ','¡Exacto! ','¡Eso es! ']))+texto+' ✔','good');E.upd();return p},
    error(it){E.vidas--;E.combo=0;tone('bad');const b=st.buckets.find(x=>x.id===it.b);
      E.say(`"${it.text}" va en ${b.label}. ${it.why||'Vuelve a salir más adelante.'}`,'bad');
      E.cola.splice(Math.min(E.cola.length,1+Math.floor(Math.random()*3)),0,it);E.upd()},
    fin(gano,parar){E.run=false;parar();const a=$('#la',host);
      if(gano){burst(50);tone('win');E.say(`¡Lo lograste! ${E.puntos} puntos 🌳`,'good');a.innerHTML='<button class="btn" id="nx">¡Listo! →</button>';$('#nx',a).onclick=()=>{tone('tap');E.done()}}
      else{E.say('¡Casi! Se acabaron los corazones. Ya sabes dónde van las que fallaste: ¡otra vez!','bad');a.innerHTML='<button class="btn" id="rt">Otra vez</button>';$('#rt',a).onclick=()=>RUN.sort(host,st,E.ctx,E.done)}},
  };
  return E;
}
// Cartel de arriba con la tarjeta actual.
function cartel(g,cw,texto,pregunta){
  g.font='700 17px "Nunito",system-ui,sans-serif';
  const lineas=wrapT(g,texto,Math.min(cw-60,560));g.font='700 11px "Nunito",monospace';const wp=g.measureText(pregunta).width;g.font='700 17px "Nunito",system-ui,sans-serif';
  const w=Math.min(cw-24,Math.max(wp,...lineas.map(l=>g.measureText(l).width))+40),h=lineas.length*21+34;
  const x=cw/2-w/2,y=8;
  g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=12;rr(g,x,y,w,h,14);g.fillStyle='#FFF7E8';g.fill();g.shadowBlur=0;g.lineWidth=3;g.strokeStyle='#14231B';g.stroke();
  g.fillStyle='#625C76';g.font='700 11px "Nunito",monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(pregunta,cw/2,y+13);
  g.fillStyle='#14231B';g.font='700 17px "Nunito",system-ui,sans-serif';lineas.forEach((l,k)=>g.fillText(l,cw/2,y+31+k*21));
  return y+h;
}

/* ---------- LANZAMIENTO ----------
   Resortera: arrastra hacia atrás desde cualquier parte, apunta con la línea de puntos y suelta.
   La semilla tiene que caer dentro de la canasta correcta. Con 1-5 se lanza directo (accesible). */
RUN.lanzar=(host,st,ctx,done)=>{
  const E=marcoClasificar(host,st,'Minijuego · Lanzamiento 🎯','Arrastra hacia atrás, apunta y suelta para lanzar la tarjeta a su canasta. También puedes tocar <b>1</b> a <b>'+st.buckets.length+'</b> para lanzar directo.');
  E.ctx=ctx;E.done=done;
  const {cv,g,tam}=E,B=st.buckets,n=B.length,GRAV=900;
  let carta=null,bala=null,apuntando=null,t=0,last=performance.now(),parts=[],textos=[],sacude=0,brillo={},fase=0,espera=.2;
  const ancla=()=>({x:Math.max(70,tam.cw*.1),y:tam.ch-120});
  // canastas repartidas a la derecha, a distintas alturas
  const cesta=(i,tt=t)=>{const x0=tam.cw*.4,x1=tam.cw-60,x=n===1?x1:x0+(x1-x0)*i/(n-1),alt=[60,150,95,175,120][i%5],mueve=E.bien>=3?Math.sin(tt*1.4+i*1.7)*26:0;
    return {x,y:tam.ch-alt+mueve,w:Math.max(64,Math.min(110,(x1-x0)/Math.max(1,n-1)-14))}};
  function nueva(){if(!E.cola.length){carta=null;return}carta=E.cola.shift();if(E.bien===0&&E.vidas===3)E.say('Arrastra hacia atrás desde Ceibita, apunta a la canasta y suelta.','')}
  function lanzar(vx,vy){if(!carta||bala)return;const a=ancla();bala={x:a.x,y:a.y,vx,vy};tone('tap')}
  function directo(i){const a=ancla(),T=.95,c=cesta(i,t+T);   // apunto a donde VA a estar la canasta
  lanzar((c.x-a.x)/T,(c.y-8-a.y-.5*GRAV*T*T)/T)}
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(tam.cw/r.width),y:(e.clientY-r.top)*(tam.ch/r.height)}};
  cv.addEventListener('pointerdown',e=>{ac();if(!carta||bala)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}apuntando=pos(e)});
  cv.addEventListener('pointermove',e=>{if(apuntando)apuntando=pos(e)});
  cv.addEventListener('pointerup',e=>{if(!apuntando)return;const v=velDe(apuntando);apuntando=null;if(Math.hypot(v.vx,v.vy)>120)lanzar(v.vx,v.vy)});
  // jalar hacia atrás: la velocidad es el vector desde el dedo hasta el ancla
  function velDe(p){const a=ancla();let dx=a.x-p.x,dy=a.y-p.y;const L=Math.hypot(dx,dy),max=150;if(L>max){dx*=max/L;dy*=max/L}return{vx:dx*6.4,vy:dy*6.4}}
  const kd=e=>{if(!E.run)return;if(/^[1-9]$/.test(e.key)&&+e.key<=n){e.preventDefault();directo(+e.key-1)}};
  addEventListener('keydown',kd);
  const parar=()=>{removeEventListener('keydown',kd)};
  function chispas(x,y,color,c){for(let i=0;i<c;i++){const a=Math.random()*7,v=60+Math.random()*260;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-140,vida:1,color})}}
  function resolver(i){
    const c=carta;carta=null;bala=null;espera=.45;const ok=B[i].id===c.b,cc=cesta(i);
    if(ok){const p=E.acierto(c.text);brillo[i]=.7;chispas(cc.x,cc.y,B[i].c,30);textos.push({x:cc.x,y:cc.y-40,txt:'+'+p,vida:1})}
    else{E.error(c);sacude=.4;brillo[B.findIndex(b=>b.id===c.b)]=1.4;chispas(cc.x,cc.y,'#DA3832',18)}
    if(E.bien>=E.total)return E.fin(true,parar);if(E.vidas<=0)return E.fin(false,parar);
  }
  function dibujar(){
    const {cw,ch}=tam;g.save();if(sacude>0)g.translate((Math.random()-.5)*16*sacude,(Math.random()-.5)*10*sacude);
    const f=g.createLinearGradient(0,0,0,ch);f.addColorStop(0,'#0B2A3A');f.addColorStop(1,'#123F2D');g.fillStyle=f;g.fillRect(-20,-20,cw+40,ch+40);
    g.fillStyle='#2E7D4F';g.fillRect(0,ch-14,cw,14);
    // canastas
    for(let i=0;i<n;i++){const c=cesta(i),b=B[i],bri=brillo[i]||0;
      g.strokeStyle='rgba(255,247,232,.15)';g.lineWidth=3;g.beginPath();g.moveTo(c.x,c.y+40);g.lineTo(c.x,ch-14);g.stroke();
      if(bri>0){g.shadowColor=b.c;g.shadowBlur=30}
      g.beginPath();g.moveTo(c.x-c.w/2,c.y);g.lineTo(c.x+c.w/2,c.y);g.lineTo(c.x+c.w/2-12,c.y+40);g.lineTo(c.x-c.w/2+12,c.y+40);g.closePath();g.fillStyle=b.c;g.fill();g.shadowBlur=0;
      g.lineWidth=3;g.strokeStyle=bri>0?'#FFC23D':'#14231B';g.stroke();
      g.fillStyle='#fff';g.font='900 13px "Nunito",sans-serif';g.textAlign='center';g.textBaseline='middle';
      const ls=wrapT(g,b.label,c.w+30).slice(0,2);
      ls.forEach((l,k)=>{const y=c.y-14-(ls.length-1-k)*15;g.strokeStyle='#14231B';g.lineWidth=4;g.strokeText(l,c.x,y);g.fillText(l,c.x,y)});
      g.fillStyle='rgba(255,255,255,.85)';g.font='700 11px "Nunito",monospace';g.fillText(String(i+1),c.x,c.y+22);
    }
    // Ceibita y la resortera
    const a=ancla();
    dibujaCeibita(g,a.x-34,ch-14,bala?fase:0,1.05);
    g.strokeStyle='#7A5634';g.lineWidth=6;g.beginPath();g.moveTo(a.x-10,ch-14);g.lineTo(a.x,a.y+10);g.lineTo(a.x-12,a.y-14);g.moveTo(a.x,a.y+10);g.lineTo(a.x+12,a.y-14);g.stroke();
    if(apuntando&&carta&&!bala){const v=velDe(apuntando);
      g.strokeStyle='#14231B';g.lineWidth=3;g.beginPath();g.moveTo(a.x-12,a.y-14);g.lineTo(a.x-v.vx/6.4,a.y-v.vy/6.4);g.lineTo(a.x+12,a.y-14);g.stroke();
      let x=a.x,y=a.y,vx=v.vx,vy=v.vy;g.fillStyle='rgba(255,194,61,.85)';
      for(let k=0;k<26;k++){const dt=.045;x+=vx*dt;y+=vy*dt;vy+=GRAV*dt;g.globalAlpha=1-k/30;g.beginPath();g.arc(x,y,3.2,0,7);g.fill()}g.globalAlpha=1}
    // la semilla (la tarjeta en vuelo)
    const sx=bala?bala.x:(apuntando?a.x-velDe(apuntando).vx/6.4:a.x),sy=bala?bala.y:(apuntando?a.y-velDe(apuntando).vy/6.4:a.y);
    if(carta){g.shadowColor='#FFC23D';g.shadowBlur=18;g.fillStyle='#FFC23D';g.beginPath();g.arc(sx,sy,11,0,7);g.fill();g.shadowBlur=0;g.strokeStyle='#14231B';g.lineWidth=2.5;g.stroke();g.fillStyle='#14231B';g.font='12px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('🃏',sx,sy+1)}
    if(carta)cartel(g,cw,carta.text,'¿EN QUÉ CANASTA VA?');
    for(const p of parts){g.globalAlpha=Math.max(0,p.vida);g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill()}g.globalAlpha=1;
    for(const x of textos){g.globalAlpha=Math.max(0,x.vida);g.fillStyle='#FFC23D';g.font='900 22px "Nunito",sans-serif';g.textAlign='center';g.strokeStyle='#14231B';g.lineWidth=4;g.strokeText(x.txt,x.x,x.y);g.fillText(x.txt,x.x,x.y)}g.globalAlpha=1;
    g.restore();
  }
  function ciclo(ahora){
    if(!E.run)return;if(!cv.isConnected){E.run=false;parar();return}
    const dt=Math.min(.05,(ahora-last)/1000);last=ahora;t+=dt;fase+=dt*12;
    if(!carta&&!bala){espera-=dt;if(espera<=0)nueva()}
    if(bala){const px=bala.x,py=bala.y;bala.x+=bala.vx*dt;bala.y+=bala.vy*dt;bala.vy+=GRAV*dt;
      if(bala.vy>0)for(let i=0;i<n;i++){const c=cesta(i);if(py<=c.y+6&&bala.y>=c.y-4&&Math.abs(bala.x-c.x)<c.w/2-4){resolver(i);break}}
      if(bala&&(bala.y>tam.ch+30||bala.x>tam.cw+40||bala.x<-40)){bala=null;tone('bad');E.say('¡Tiro fallido! No pasa nada: apunta otra vez.','')}}
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.vida-=dt*1.4}parts=parts.filter(p=>p.vida>0);
    for(const x of textos){x.y-=50*dt;x.vida-=dt*1.2}textos=textos.filter(x=>x.vida>0);
    for(const k in brillo){brillo[k]-=dt;if(brillo[k]<=0)delete brillo[k]}
    if(sacude>0)sacude=Math.max(0,sacude-dt);
    if(E.run){dibujar();requestAnimationFrame(ciclo)}
  }
  E.upd();requestAnimationFrame(ciclo);
};

/* ---------- ENLAZAR ----------
   Las tarjetas están a la izquierda y los grupos a la derecha. Se arrastra un hilo desde la tarjeta
   hasta su grupo (o se toca la tarjeta y después el grupo). Si es correcto, la tarjeta viaja por el hilo. */
RUN.enlazar=(host,st,ctx,done)=>{
  const B=st.buckets,total=st.items.length;
  let cola=shuffle(st.items.map((it,k)=>({...it,k}))),bien=0,vidas=3,combo=0,puntos=0,sel=null,ocupado=false;
  host.innerHTML=`<div class="gtitle"><span class="eyebrow" style="color:var(--gold)">Minijuego · Enlazar 🔗</span><h3>${st.title}</h3><p>Arrastra un hilo desde cada tarjeta hasta su grupo (o toca la tarjeta y después el grupo).</p></div>
    <div class="gstat"><span id="eq">🔗 0/${total}</span><span id="ec"></span><span id="ep">⭐ 0</span><span id="eh">❤️❤️❤️</span></div>
    <div class="enlazar"><svg class="hilos" aria-hidden="true"></svg><div class="ecol izq"></div>
      <div class="ecol der">${B.map(b=>`<button class="socket" data-b="${b.id}" style="--c:${b.c};--bg:${b.bg}"><i class="pto"></i><b>${b.label}</b><span class="n">0</span></button>`).join('')}</div></div>
    <p class="fb" aria-live="polite"></p><div class="act" id="ea"></div>`;
  const caja=$('.enlazar',host),svg=$('.hilos',host),izq=$('.izq',host),fb=$('.fb',host);
  const say=(m,c)=>{fb.textContent=m;fb.className='fb '+(c||'')};
  const upd=()=>{$('#eq',host).textContent=`🔗 ${bien}/${total}`;$('#ep',host).textContent=`⭐ ${puntos}`;$('#ec',host).textContent=combo>=2?`🔥 x${combo}`:'';$('#eh',host).textContent='❤️'.repeat(Math.max(0,vidas))+'🤍'.repeat(3-Math.max(0,vidas))};
  // Punto (x, y) de un elemento, medido dentro de la caja del juego.
  const pt=(el,lado)=>{const r=el.getBoundingClientRect(),c=caja.getBoundingClientRect();return {x:(lado==='der'?r.right:r.left)-c.left,y:r.top+r.height/2-c.top}};
  const curva=(a,b)=>{const dx=Math.max(40,Math.abs(b.x-a.x)*.5);return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`};
  const hilo=(cls)=>{const h=document.createElementNS('http://www.w3.org/2000/svg','path');h.setAttribute('class','hilo '+(cls||''));svg.appendChild(h);return h};
  function tarjetas(){
    sel=null;const vis=cola.slice(0,4);
    izq.innerHTML=vis.map((it,i)=>`<button class="tile ecarta" data-i="${i}">${it.text}<i class="pto"></i></button>`).join('')||'';
    $$('.ecarta',izq).forEach(conectarTarjeta);
  }
  // Decide si el hilo llegó al grupo correcto.
  function juzgar(i,sock,h){
    const it=cola[i],t=$(`.ecarta[data-i="${i}"]`,izq);if(!it||!t||ocupado){if(h)h.remove();return}
    const a=pt(t,'der'),b=pt(sock,'izq');
    if(!h){h=hilo();h.setAttribute('d',curva(a,b));h.classList.add('dibuja')}else h.setAttribute('d',curva(a,b));
    if(it.b===sock.dataset.b){
      ocupado=true;bien++;combo++;const p=10+Math.min(combo,6)*2;puntos+=p;tone(combo>=3?'win':'place');addXP(3,sock);
      h.style.stroke=sock.style.getPropertyValue('--c');h.classList.add('bien');
      say((combo>=3?`¡Combo x${combo}! `:pick(['¡Bien! ','¡Exacto! ','¡Enlazado! ']))+it.text+' ✔','good');
      // La tarjeta viaja por el hilo hasta el grupo.
      const r1=t.getBoundingClientRect(),r2=sock.getBoundingClientRect();
      t.style.setProperty('--vx',(r2.left-r1.left)+'px');t.style.setProperty('--vy',(r2.top+r2.height/2-r1.top-r1.height/2)+'px');t.classList.add('viaja');
      setTimeout(()=>{const n=$('.n',sock);n.textContent=+n.textContent+1;sock.classList.remove('recibe');void sock.offsetWidth;sock.classList.add('recibe');
        h.classList.add('sale');setTimeout(()=>h.remove(),400);cola.splice(i,1);ocupado=false;upd();
        if(!cola.length)return fin(true);tarjetas()},520);
    }else{
      vidas--;combo=0;tone('bad');h.classList.add('mal');t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');
      const ok=B.find(x=>x.id===it.b);say(`"${it.text}" va en ${ok.label}. ${it.why||'Vuelve a salir más adelante.'}`,'bad');
      $$('.socket',host).forEach(x=>x.classList.toggle('pista',x.dataset.b===it.b));
      setTimeout(()=>{h.remove();$$('.socket',host).forEach(x=>x.classList.remove('pista'))},900);
      upd();if(vidas<=0)return fin(false);
      cola.splice(i,1);cola.splice(Math.min(cola.length,3+Math.floor(Math.random()*3)),0,it);setTimeout(tarjetas,700);
    }
  }
  function conectarTarjeta(t){
    let h=null,sx=null,sy=0,arrastra=false;
    t.addEventListener('pointerdown',e=>{if(ocupado)return;sx=e.clientX;sy=e.clientY;arrastra=false;try{t.setPointerCapture(e.pointerId)}catch(_){}});
    t.addEventListener('pointermove',e=>{if(sx==null)return;
      if(!arrastra&&Math.hypot(e.clientX-sx,e.clientY-sy)>6){arrastra=true;h=hilo('tirando');t.classList.add('sel')}
      if(arrastra){const c=caja.getBoundingClientRect();h.setAttribute('d',curva(pt(t,'der'),{x:e.clientX-c.left,y:e.clientY-c.top}));
        const el=document.elementFromPoint(e.clientX,e.clientY),so=el&&el.closest('.socket');$$('.socket',host).forEach(x=>x.classList.toggle('over',x===so))}});
    t.addEventListener('pointerup',e=>{if(sx==null)return;sx=null;$$('.socket',host).forEach(x=>x.classList.remove('over'));
      if(arrastra){t.classList.remove('sel');h.classList.remove('tirando');const el=document.elementFromPoint(e.clientX,e.clientY),so=el&&el.closest('.socket');
        if(so)juzgar(+t.dataset.i,so,h);else{h.classList.add('suelta');const hh=h;setTimeout(()=>hh.remove(),250)}h=null}
      else{$$('.ecarta',izq).forEach(x=>x.classList.remove('sel'));t.classList.add('sel');sel=+t.dataset.i;tone('tap');say('Ahora toca su grupo 👉','')}});
    t.addEventListener('pointercancel',()=>{sx=null;if(h){h.remove();h=null}});
  }
  $$('.socket',host).forEach(so=>so.onclick=()=>{if(sel!=null)juzgar(sel,so,null);else say('Primero toca una tarjeta de la izquierda 👈','')});
  function fin(gano){
    const a=$('#ea',host);
    if(gano){burst(50);tone('win');say(`¡Todo enlazado! ${puntos} puntos 🌳`,'good');a.innerHTML='<button class="btn" id="nx">¡Listo! →</button>';$('#nx',a).onclick=()=>{tone('tap');done()}}
    else{say('¡Casi! Se acabaron los corazones. Ya sabes dónde van las que fallaste: ¡otra vez!','bad');a.innerHTML='<button class="btn" id="rt">Otra vez</button>';$('#rt',a).onclick=()=>RUN.enlazar(host,st,ctx,done)}
  }
  tarjetas();upd();
};

/* ---------- ARMAR EL ÁRBOL ----------
   Las cajas son partes del árbol (pisos de la copa, raíces, suelo). Se arrastra cada tarjeta a su
   parte del árbol (o se toca la tarjeta y después la parte). st.capas dice cómo se apilan, de arriba abajo. */
RUN.armar=(host,st,ctx,done)=>{
  const queue=shuffle(st.items.map(it=>({t:it.text,z:it.b,why:it.why})));
  const total=queue.length;let placed=0,sel=null;const miss={};
  const cap=id=>st.items.filter(it=>it.b===id).length;
  const zona=id=>{const b=st.buckets.find(x=>x.id===id);return `<div class="zone" data-z="${id}" data-cap="${cap(id)}" style="--c:${b.c};--bg:${b.bg}"><div class="zh"><span>${b.label}</span><span class="cnt">0/${cap(id)}</span></div><div class="zin"></div></div>`};
  const capas=st.capas||st.buckets.map(b=>b.id),it=capas.indexOf('tronco');
  const capa=(c,n)=>{
    if(c==='tronco')return `<div class="btrunk ctronco">🪵 ${st.tronco||'Problema central'}</div>`;
    const lugar=it<0?'':n<it?'copa':'raiz',ancho=lugar==='copa'?Math.round(100-(it-1-n)*16)+'%':'100%';
    const html=Array.isArray(c)?`<div class="zrow" style="grid-template-columns:repeat(${c.length},1fr)">${c.map(zona).join('')}</div>`:zona(c);
    return `<div class="capa ${lugar}" style="width:${ancho}">${html}</div>`};
  host.innerHTML=`<div class="gtitle"><span class="eyebrow" style="color:var(--gold)">Minijuego · Arma el árbol 🌳</span><h3>${st.title}</h3><p>Arrastra cada tarjeta a su parte del árbol (o tócala y luego toca su lugar).</p></div>
   <div class="gstat"><span id="bp">🌳 0/${total}</span></div>
   <div class="build arbolito">${capas.map(capa).join('')}</div>
   <div class="tray" id="tray"></div><p class="fb" aria-live="polite"></p><div class="act"><button class="btn" id="nx" hidden>¡Listo! →</button></div>`;
  const fb=$('.fb',host),say=(m,c)=>{fb.textContent=m;fb.className='fb '+c};
  const zoneAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e?e.closest('.zone'):null};
  function place(i,z){
    const c=queue[i];if(!c||!z)return;
    if(c.z===z.dataset.z){
      const sp=document.createElement('span');sp.textContent=c.t;$('.zin',z).appendChild(sp);
      const n=$('.zin',z).children.length;$('.cnt',z).textContent=n+'/'+z.dataset.cap;if(n>=+z.dataset.cap)z.classList.add('full');
      z.classList.remove('recibe');void z.offsetWidth;z.classList.add('recibe');
      queue.splice(i,1);placed++;$('#bp',host).textContent='🌳 '+placed+'/'+total;tone('place');addXP(3,z);say(pick(['¡En su lugar!','¡Bien!','¡Eso!']),'good');
      $$('.zone',host).forEach(x=>x.classList.remove('hint'));tray();
      if(!queue.length){burst(70);tone('win');say('¡Árbol armado! 🌳','good');$('#nx',host).hidden=false}
    }else{
      miss[c.t]=(miss[c.t]||0)+1;tone('bad');z.classList.remove('shake');void z.offsetWidth;z.classList.add('shake');
      if(miss[c.t]>=2){const ok=$(`.zone[data-z="${c.z}"]`,host);ok.classList.remove('hint');void ok.offsetWidth;ok.classList.add('hint');say('Pista: va en la parte que brilla ✨','bad')}
      else say(c.why||'Ahí no va. Piensa en qué parte del árbol le toca.','bad');
    }
  }
  function attach(t){
    let sx=null,sy=0,drag=false,gh=null;
    t.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;drag=false;try{t.setPointerCapture(e.pointerId)}catch(_){}});
    t.addEventListener('pointermove',e=>{if(sx==null)return;if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){drag=true;gh=t.cloneNode(true);gh.classList.add('ghost','sel');document.body.appendChild(gh)}
      if(drag){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';const z=zoneAt(e.clientX,e.clientY);$$('.zone',host).forEach(x=>x.classList.toggle('over',x===z))}});
    t.addEventListener('pointerup',e=>{if(sx==null)return;sx=null;
      if(drag){gh.remove();gh=null;$$('.zone',host).forEach(x=>x.classList.remove('over'));const z=zoneAt(e.clientX,e.clientY);if(z)place(+t.dataset.i,z)}
      else{$$('.tray .tile',host).forEach(x=>x.classList.remove('sel'));t.classList.add('sel');sel=+t.dataset.i;tone('tap');say('Ahora toca su lugar en el árbol 👆','')}});
    t.addEventListener('pointercancel',()=>{sx=null;if(gh){gh.remove();gh=null}});
  }
  function tray(){const tr=$('#tray',host);sel=null;const vis=queue.slice(0,3);
    tr.innerHTML=vis.length?vis.map((c,i)=>`<button class="tile" data-i="${i}">${c.t}</button>`).join(''):'<p class="center" style="margin:0">¡No quedan piezas! 🎉</p>';
    $$('.tile',tr).forEach(attach)}
  $$('.zone',host).forEach(z=>z.onclick=()=>{if(sel!=null)place(sel,z);else say('Primero toca una tarjeta de abajo 👇','')});
  tray();
  $('#nx',host).onclick=()=>{tone('tap');done()};
};

// Cada misión con un juego distinto.
(()=>{const modos={sistema:'enlazar',modelo:'enlazar',problema:'lanzar',datos:'lanzar',efectos:'armar',entorno:'armar'};
  Object.entries(modos).forEach(([mid,modo])=>{const s=MBYID[mid].steps.find(x=>x.t==='sort');if(s)s.modo=modo});
  // Cómo se apilan las partes del árbol en los juegos de armar (de arriba hacia abajo).
  const ef=MBYID.efectos.steps.find(x=>x.t==='sort');if(ef){ef.capas=['f','i','d','tronco'];ef.title='Arma la copa: ¿en qué piso va cada efecto?'}
  const en=MBYID.entorno.steps.find(x=>x.t==='sort');if(en){en.capas=['tronco','in','out'];en.title='Arma la base del árbol: ¿raíz del sistema o suelo del entorno?'}
  // Las otras clasificaciones de datos y problema también se arman en el árbol.
  const pr=MBYID.problema.steps.filter(x=>x.t==='sort')[0];if(pr){pr.modo='armar';pr.capas=['tronco',['act','dat','pro','con']];pr.title='Arma las raíces: ¿a qué componente pertenece cada elemento?'}
})();

RUN.order=(host,st,ctx,done)=>{

RUN.match=(host,st,ctx,done)=>{
  const L=shuffle(st.pairs.map((p,k)=>({t:p[0],k}))),R=shuffle(st.pairs.map((p,k)=>({t:p[1],k})));let sl=null,sr=null,left=st.pairs.length;
  host.innerHTML=`<div class="gtitle"><span class="eyebrow" style="color:var(--gold)">Minijuego</span><h3>${st.title}</h3><p>Toca uno de la izquierda y su pareja de la derecha.</p></div>
   <div class="match"><div class="col">${L.map(x=>`<button class="tile" data-s="l" data-k="${x.k}">${x.t}</button>`).join('')}</div><div class="col">${R.map(x=>`<button class="tile" data-s="r" data-k="${x.k}" style="font-weight:400">${x.t}</button>`).join('')}</div></div>
   <p class="fb" aria-live="polite"></p><div class="act"><button class="btn" id="nx" hidden>¡Listo! →</button></div>`;
  const fb=$('.fb',host);
  function check(){
    if(!sl||!sr)return;

      if(!left){burst(30);tone('win');fb.textContent='¡Todas las parejas! 🌳';$('#nx',host).hidden=false}}
    else{tone('bad');[sl,sr].forEach(x=>{x.classList.remove('sel','shake');void x.offsetWidth;x.classList.add('shake')});fb.textContent='No son pareja. Intenta otra.';fb.className='fb bad'}
    sl=sr=null;

    if(t.dataset.s==='l'){if(sl)sl.classList.remove('sel');sl=t}else{if(sr)sr.classList.remove('sel');sr=t}

RUN.tf=(host,st,ctx,done)=>{

RUN.battle=(host,st,ctx,done)=>{

function battle(host,mon,make,opt){
  let qs,hp,max,hearts,qi,errs,combo;
  function start(){qs=make();max=hp=qs.length;hearts=opt.hearts;qi=0;errs=0;combo=0;draw();ask()}
  function draw(){
    host.innerHTML=`<div class="arena"><div class="monw">${monster(mon.col,mon.boss)}</div><div><span class="eyebrow" style="color:var(--gold)">${opt.practice?'Repaso':'Batalla'}</span><div class="mname">${mon.name}</div><div class="hp"><i></i></div>
     <div style="display:flex;justify-content:space-between;align-items:center"><span class="hearts"></span><span class="combo"></span></div></div></div><div id="qa"></div>`;
    upd();
  }
  function upd(){$('.hp i',host).style.width=(hp/max*100)+'%';$('.hearts',host).textContent='❤️'.repeat(hearts)+'🤍'.repeat(Math.max(0,opt.hearts-hearts));$('.combo',host).textContent=combo>=2?'COMBO x'+combo:''}
  function ask(){
    const q=qs[qi],opts=shuffle([q.a,...q.w]);
    const qa=$('#qa',host);

RUN.build=(host,st,ctx,done)=>{
  const queue=shuffle([...Object.entries(CAUSAS).flatMap(([k,a])=>a.map(t=>({t,z:'c-'+k}))),...Object.entries(EFD).map(([k,t])=>({t,z:'d-'+k})),...EFI.map(t=>({t,z:'i'})),{t:EFF,z:'f'}]);
  const total=queue.length;let placed=0,sel=null;const miss={};
  const zone=(id,label,k,cap)=>`<div class="zone" data-z="${id}" data-cap="${cap}" style="--c:${COL[k][0]};--bg:${COL[k][1]}"><div class="zh"><span>${label}</span><span class="cnt">0/${cap}</span></div><div class="zin"></div></div>`;
  host.innerHTML=`<div class="gtitle"><span class="eyebrow" style="color:var(--gold)">Construye tu árbol 🌳</span><h3>Arma el árbol completo con tus manos</h3><p>Arrastra cada tarjeta a su lugar (o tócala y luego toca su lugar). Son ${total} piezas, de 3 en 3.</p></div>
   <div class="gstat"><span id="bp">🌳 0/${total}</span></div>
   <div class="build">${zone('f','🍃 EFECTO FINAL','trk',1)}${zone('i','🍃 EFECTOS INDIRECTOS','efe',3)}
    <div class="zrow">${['act','dat','pro','con'].map(k=>zone('d-'+k,'DIRECTO · '+C[k].n.toUpperCase(),k,1)).join('')}</div>
    <div class="btrunk">🪵 ${PROBLEMA}</div>
    <div class="zrow">${['act','dat','pro','con'].map(k=>zone('c-'+k,'🌱 '+C[k].n.toUpperCase(),k,3)).join('')}</div></div>
   <div class="tray" id="tray"></div><p class="fb" aria-live="polite"></p><div class="act"><button class="btn" id="nx" hidden>¡Árbol completo! →</button></div>`;
  const fb=$('.fb',host),say=(m,c)=>{fb.textContent=m;fb.className='fb '+c};
  const zoneAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e?e.closest('.zone'):null};
  function place(i,z){
    const c=queue[i];if(!c||!z)return;
    if(c.z===z.dataset.z){
      const s=document.createElement('span');s.textContent=c.t;$('.zin',z).appendChild(s);
      const n=$('.zin',z).children.length;$('.cnt',z).textContent=n+'/'+z.dataset.cap;if(n>=+z.dataset.cap)z.classList.add('full');
      queue.splice(i,1);placed++;$('#bp',host).textContent='🌳 '+placed+'/'+total;tone('place');addXP(3,z);say(pick(['¡En su lugar!','¡Bien!','¡Eso!']),'good');
      $$('.zone',host).forEach(x=>x.classList.remove('hint'));tray();
      if(!queue.length){burst(90);tone('win');say('¡Construiste tu árbol completo! 🌳','good');$('#nx',host).hidden=false}
    }else{
      miss[c.t]=(miss[c.t]||0)+1;tone('bad');z.classList.remove('shake');void z.offsetWidth;z.classList.add('shake');
